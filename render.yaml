services:
  - type: web
    name: maan-estate-backend
    env: python
    rootDir: backend
    pythonVersion: 3.11.11
    plan: free
    buildCommand: python -m pip install --upgrade pip uv && uv sync --frozen --no-dev && uv run python manage.py collectstatic --noinput
    startCommand: uv run gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: maan-estate-backend.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://maan-estate-backend.onrender.com,https://wali-estate-frontend.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://wali-estate-frontend.vercel.app
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 60
      - key: MAX_FILE_SIZE
        value: 10485760
      - key: UPLOAD_DIR
        value: uploads
